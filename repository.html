<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verification Archive — AHOY</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="archive">
  <div id="site-header"></div>
  <section class="page-hero">
    <div class="wrap">
      <div class="kicker">Interactive repository</div>
      <h1>Verification archive</h1>
      <p>Every project, visit, photograph, partnership and publication AHOY is willing to stand behind. Filter by country or category. Open a record to see who signed it, when, and which papers sit underneath.</p>
    </div>
  </section>

  <section class="section" style="padding-top:36px">
    <div class="wrap">
      <div class="search-row">
        <input id="q" type="search" placeholder="Search titles, summaries, archive IDs…">
        <select id="country">
          <option value="all">All countries</option>
        </select>
        <select id="sort">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
        </select>
      </div>
      <div class="filters" id="cats"></div>
      <p class="muted" id="count" style="margin-bottom:16px"></p>
      <div class="archive-grid" id="grid"></div>
    </div>
  </section>

  <div class="modal-back" id="modal">
    <div class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/repository.js"></script>
</body>
</html>
